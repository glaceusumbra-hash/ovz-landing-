<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gates - OVZ</title>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&family=Inter:wght@400;600;700&family=IM+Fell+Double+Pica&display=swap" rel="stylesheet">
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #80A7FB 10%, #5870A4 40%, #041843 45%, #030E26 95%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "IM Fell Double Pica", serif;
    color: #ffffff;
    overflow-x: hidden;
}

/* === HEADER SUPERIOR === */
.header{
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-container{ width: 110px; height: 110px; }
.logo-container img{ width: 100%; height: 100%; object-fit: contain; }

.center-folder{
    width: 85px;
    height: 85px;
    background: #e6e6e6;
    border-radius: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
.center-folder img{ width: 70%; height: 70%; object-fit: contain; }

.brand-text{
    font-size: 40px;
    color: #ffffff;
    text-shadow: 0px -3px 0px rgba(243, 235, 235, 0.9), 0px 4px 12px rgba(0,0,0,0.5);
}

/* === SELECTORES PRINCIPALES (Z | STAGES | GATES) === */
.main-selectors{
    display: flex;
    width: 90%;
    max-width: 950px;
    margin-top: 15px;
    background: #2b2b2b;
    border-radius: 30px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.nav-btn{
    flex: 1;
    padding: 14px 0;
    text-align: center;
    font-family: "Chivo Mono", monospace;
    font-size: 24px;
    color: #cccccc;
    text-decoration: none;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

.nav-btn:last-child { border-right: none; }
.nav-btn:hover { background: #3a3a3a; color: #ffffff; }

.nav-btn.active{
    background: #8b8f94;
    font-weight: bold;
    color: #ffffff;
}

/* === CONTENEDOR PRINCIPAL MOCK-UP OSCURO === */
.viewer-container{
    width: 90%;
    max-width: 1050px;
    background: #211c1d;
    border-radius: 14px;
    display: flex;
    padding: 40px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    margin-top: 25px;
    margin-bottom: 40px;
    min-height: 500px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.left-controls{
    flex: 0.9;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    padding-right: 35px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tab-buttons{
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

.tab-label{
    flex: 1;
    text-align: center;
    border: 1px solid #444;
    padding: 12px 0;
    cursor: pointer;
    font-weight: bold;
    color: #ffffff;
    font-family: "Chivo Mono", monospace;
    font-size: 16px;
    background: transparent;
    transition: all 0.2s ease;
}

.tab-label:hover { border-color: #888; }

.tab-label.active{
    border-color: #ff3b3b;
    background: rgba(255, 59, 59, 0.1);
}

.text-content { 
    display: none !important; 
    color: #cccccc; 
    line-height: 1.6; 
    font-size: 15px; 
    font-family: 'Inter', sans-serif; 
}
.text-content.active { 
    display: block !important; 
    animation: fadeIn 0.25s ease-in-out forwards;
}
.text-content strong { 
    color: #ffffff; 
    font-size: 18px; 
    display: block;
    margin-bottom: 6px;
}

.right-visualizer{
    flex: 1.2;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-left: 35px;
    overflow: hidden;
    min-width: 0;
}

/* === SISTEMA DE VISTAS (G1, G2, G3) ESTRICTO === */
.view-panel {
    display: none !important; 
    width: 100%;
    height: 100%;
    min-height: 420px;
    border-radius: 8px;
    overflow: hidden;
}

.view-panel.active {
    display: flex !important; 
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.25s ease-in-out forwards;
}

.view-panel img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.99); }
    to { opacity: 1; transform: scale(1); }
}

/* ====================================================
   RESPONSIVE - DISPOSITIVOS MÓVILES (< 800px)
==================================================== */
@media (max-width: 800px) {
    .header {
        padding: 15px 20px;
    }

    .logo-container { width: 70px; height: 70px; }
    .center-folder { width: 65px; height: 65px; border-radius: 18px; }
    .brand-text { font-size: 28px; }

    .main-selectors {
        width: 95%;
        margin-top: 15px;
    }

    .nav-btn {
        font-size: 18px;
        padding: 12px 0;
    }

    .viewer-container {
        width: 95%;
        flex-direction: column;
        padding: 25px 20px;
        min-height: auto;
        margin-top: 20px;
    }

    .left-controls {
        flex: none;
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-right: 0;
        padding-bottom: 25px;
    }

    .tab-buttons {
        margin-bottom: 20px;
    }

    .tab-label {
        font-size: 15px;
        padding: 10px 0;
    }

    .text-content {
        font-size: 14px;
        min-height: 60px;
    }

    .right-visualizer {
        width: 100%;
        padding-left: 0;
        padding-top: 25px;
    }

    .view-panel {
        min-height: 280px;
    }

    .view-panel img {
        max-height: 280px;
    }
}

@media (max-width: 400px) {
    .logo-container { width: 55px; height: 55px; }
    .center-folder { width: 55px; height: 55px; }
    .brand-text { font-size: 24px; }
    .nav-btn { font-size: 15px; }
}
</style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/OVZ.png" alt="OVZ" />
            </a>
        </div>

        <div class="center-folder">
            <img src="assets/Chrome.png" alt="idea" />
        </div>

        <div class="brand-text">
            OVZ
        </div>
    </header>

<nav class="main-selectors">
    <a href="get_your_landing.html" class="nav-btn">Z</a>
    <a href="stages.html" class="nav-btn">Stages</a>
    <a href="gates.html" class="nav-btn active">Gates</a> 
</nav>

<div class="viewer-container">

    <div class="left-controls">
        <!-- BOTONES G1, G2, G3 -->
        <div class="tab-buttons" id="tabButtons">
            <div class="tab-label active" data-target="1">G 1</div>
            <div class="tab-label" data-target="2">G 2</div>
            <div class="tab-label" data-target="3">G 3</div>
        </div>
        
        <!-- Textos Dinámicos -->
        <div id="text-1" class="text-content active">
            <strong>Navegación:</strong>
            Organiza la estructura con precisión para una lectura limpia y sin fricción.
        </div>
        <div id="text-2" class="text-content">
            <strong>Comercio:</strong>
            Guía al cliente directo hacia la oferta sin saturar la interfaz.
        </div>
        <div id="text-3" class="text-content">
            <strong>Exclusividad:</strong>
            Fusiona el concepto estético para elevar la percepción de marca.
        </div>
    </div>
    
    <div class="right-visualizer">
        
        <!-- VISTA G1 (Única activa por defecto) -->
        <div id="view-1" class="view-panel active" style="background: #ffffff;">
            <img src="get land/gates/GATES W.png" alt="Diagrama G1">
        </div>

        <!-- VISTA G2 (Corregido: sin clase active inicial) -->
        <div id="view-2" class="view-panel" style="background: #ffffff;">
            <img src="get land/gates/theatre.png" alt="theatre">
        </div>

        <!-- VISTA G3 -->
        <div id="view-3" class="view-panel" style="background: #0d1b2a;">
            <img src="get land/gates/sigma.png" alt="Sigma G3">
        </div>

    </div>

</div>

<!-- SCRIPT OPTIMIZADO Y BLINDADO -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const tabsContainer = document.getElementById('tabButtons');
    const tabs = document.querySelectorAll('.tab-label');
    const views = document.querySelectorAll('.view-panel');
    const texts = document.querySelectorAll('.text-content');

    if (!tabsContainer) return;

    tabsContainer.addEventListener('click', (event) => {
        const selectedTab = event.target.closest('.tab-label');

        if (!selectedTab || selectedTab.classList.contains('active')) return;

        const targetId = selectedTab.getAttribute('data-target');
        const targetView = document.getElementById('view-' + targetId);
        const targetText = document.getElementById('text-' + targetId);

        if (!targetView || !targetText) return;

        // 1. Limpiar todas las clases activas
        tabs.forEach(t => t.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        texts.forEach(txt => txt.classList.remove('active'));

        // 2. Activar síncronamente el elemento seleccionado
        selectedTab.classList.add('active');
        targetView.classList.add('active');
        targetText.classList.add('active');
    });
});
</script>
</body>
</html>
