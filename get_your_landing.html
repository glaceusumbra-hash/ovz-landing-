<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z - Visualizador | OVZ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&family=IM+Fell+Double+Pica&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-serif: "IM Fell Double Pica", serif;
            --font-mono: "Chivo Mono", monospace;
            --font-sans: "Roboto", sans-serif;
            --title-shadow: 0px -3px 0px rgba(243, 235, 235, 0.9), 0px 5px 15px rgba(0, 0, 0, 0.6);
            --bg-card: #211c1d;
            --border-card: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0;
            min-height: 100vh;
            font-family: var(--font-serif);
            background: linear-gradient(180deg, #80A7FB 10%, #5870A4 40%, #041843 45%, #030E26 95%);
            color: #FFFFFF;
            display: flex; flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            width: 100%; 
            padding: 20px 40px; 
            box-sizing: border-box;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .logo-container { width: 110px; height: 110px; display: flex; justify-content: center; align-items: center; }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; }

        .center-folder {
            width: 85px; height: 85px;
            background-color: #e6e6e6;
            border-radius: 24px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .center-folder img { width: 70%; height: 70%; object-fit: contain; }
        
        .brand-text { font-size: 38px; letter-spacing: 2px; text-shadow: var(--title-shadow); margin: 0; }

        /* --- SELECTORES SUPERIORES (Z | STAGES | GATES) --- */
        .main-selectors {
            display: flex;
            width: 90%;
            max-width: 950px;
            margin-top: 15px;
            background-color: #2b2b2b;
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .nav-btn {
            flex: 1; padding: 14px 0; text-align: center; font-family: var(--font-mono);
            font-size: 22px; color: #d0d0d0; text-decoration: none; border-right: 1px solid rgba(255, 255, 255, 0.1); 
            transition: background 0.2s ease, color 0.2s;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn:hover { background-color: #3f3f3f; color: #fff; }
        .nav-btn.active { background-color: #8b8f94; color: #ffffff; font-weight: bold; }

        /* --- CONTENEDOR TIPO MOCK-UP (OSCURO) --- */
        .viewer-container {
            width: 90%; 
            max-width: 1050px; 
            background-color: var(--bg-card); 
            border-radius: 14px;
            display: flex; 
            padding: 40px; 
            box-sizing: border-box; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            margin-top: 25px; 
            margin-bottom: 40px;
            min-height: 480px;
            border: 1px solid var(--border-card);
        }

        /* Ocultar radios de control */
        input[type="radio"] { display: none; }

        /* --- COLUMNA IZQUIERDA --- */
        .left-controls {
            flex: 0 0 340px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            border-right: 1px solid var(--border-card); 
            padding-right: 35px; 
            box-sizing: border-box;
        }

        .tab-buttons { 
            display: flex; 
            gap: 12px; 
            width: 100%; 
            margin-bottom: 30px;
        }

        .tab-label {
            flex: 1; 
            padding: 12px 0; 
            background-color: transparent; 
            border: 1px solid #444; 
            color: #ffffff;
            font-family: var(--font-mono); 
            font-size: 20px; 
            font-weight: bold; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .tab-label:hover { border-color: #777; }

        /* Estado activo en botones (Borde rojo) */
        #tab-w:checked ~ .left-controls .tab-buttons label[for="tab-w"],
        #tab-m:checked ~ .left-controls .tab-buttons label[for="tab-m"],
        #tab-wi:checked ~ .left-controls .tab-buttons label[for="tab-wi"] {
            background-color: rgba(255, 59, 48, 0.1); 
            color: #ffffff; 
            border-color: #ff3b30; 
        }

        /* Textos dinámicos */
        .dynamic-text {
            font-family: var(--font-sans); 
            font-size: 17px; 
            font-weight: 400; 
            color: #cccccc; 
            line-height: 1.6; 
            margin: 0; 
            display: none;
        }
        .dynamic-text strong { 
            color: #ffffff; 
            font-size: 20px; 
            display: block; 
            margin-bottom: 6px; 
        }

        #tab-w:checked ~ .left-controls .text-w { display: block; animation: fadeIn 0.25s ease; }
        #tab-m:checked ~ .left-controls .text-m { display: block; animation: fadeIn 0.25s ease; }
        #tab-wi:checked ~ .left-controls .text-wi { display: block; animation: fadeIn 0.25s ease; }

        /* --- COLUMNA DERECHA (VISUALIZADOR) --- */
        .right-visualizer {
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding-left: 35px; 
            overflow: hidden;
            min-width: 0;
        }

        .view-image {
            width: 100%;
            height: 100%;
            max-height: 380px;
            object-fit: contain;
            display: none;
        }

        #tab-w:checked ~ .right-visualizer .img-w { display: block; animation: fadeIn 0.25s ease; }
        #tab-m:checked ~ .right-visualizer .img-m { display: block; animation: fadeIn 0.25s ease; }
        #tab-wi:checked ~ .right-visualizer .img-wi { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.98); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* ====================================================
           RESPONSIVE - DISPOSITIVOS MÓVILES (< 800px)
        ==================================================== */
        @media (max-width: 800px) {
            .header {
                padding: 15px 20px;
            }

            .logo-container { width: 75px; height: 75px; }
            .center-folder { width: 65px; height: 65px; border-radius: 18px; }
            .brand-text { font-size: 28px; }

            .main-selectors {
                width: 95%;
                margin-top: 15px;
            }

            .nav-btn {
                font-size: 17px;
                padding: 12px 0;
            }

            /* Apilado vertical del contenedor */
            .viewer-container {
                width: 95%;
                flex-direction: column;
                padding: 25px 20px;
                min-height: auto;
                margin-top: 20px;
            }

            .left-controls {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-card);
                padding-right: 0;
                padding-bottom: 25px;
            }

            .tab-buttons {
                margin-bottom: 20px;
            }

            .tab-label {
                padding: 10px 0;
                font-size: 17px;
            }

            .dynamic-text {
                font-size: 15px;
                min-height: 50px;
            }

            .right-visualizer {
                width: 100%;
                padding-left: 0;
                padding-top: 25px;
            }

            .view-image {
                max-height: 260px;
            }
        }

        /* Móviles compactos (< 400px) */
        @media (max-width: 400px) {
            .logo-container { width: 60px; height: 60px; }
            .center-folder { width: 55px; height: 55px; }
            .brand-text { font-size: 24px; }
            .nav-btn { font-size: 15px; }
            .view-image { max-height: 210px; }
        }
    </style>
</head>
<body>

    <!-- Cabecera Superior -->
    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/OVZ.png" alt="OVZ" />
            </a>
        </div>

        <div class="center-folder">
            <img src="assets/Chrome.png" alt="idea" />
        </div>

        <div class="brand-text">
            OVZ
        </div>
    </header>

    <!-- SELECTORES PRINCIPALES -->
    <nav class="main-selectors">
        <a href="get_your_landing.html" class="nav-btn active">Z</a>
        <a href="stages.html" class="nav-btn">Stages</a>
        <a href="gates.html" class="nav-btn">Gates</a>
    </nav>

    <!-- CUADRO DE VISUALIZACIÓN INTERACTIVO -->
    <div class="viewer-container">
        
        <!-- Controles de estado -->
        <input type="radio" name="tabs" id="tab-w" checked>
        <input type="radio" name="tabs" id="tab-m">
        <input type="radio" name="tabs" id="tab-wi">

        <!-- Panel Izquierdo -->
        <div class="left-controls">
            
            <div class="tab-buttons">
                <label for="tab-w" class="tab-label">W</label>
                <label for="tab-m" class="tab-label">M</label>
                <label for="tab-wi" class="tab-label">Wi</label>
            </div>

            <!-- Textos con alto contraste -->
            <p class="dynamic-text text-w">
                <strong>Wireframe:</strong>
                Estructura básica y arquitectura de información sin saturación de contenido.
            </p>
            <p class="dynamic-text text-m">
                <strong>MacOS:</strong>
                Elementos refinados e iconografía con el lenguaje visual de Apple.
            </p>
            <p class="dynamic-text text-wi">
                <strong>Windows/Linux:</strong>
                Disposición modular orientada a sistemas de escritorio amplios.
            </p>
            
        </div>

        <!-- Panel Derecho -->
        <div class="right-visualizer">
            <img src="assets/wireframe.png" alt="Wireframe" class="view-image img-w">
            <img src="assets/mcOS.png" alt="macOS Style" class="view-image img-m">
            <img src="assets/Wind Os.png" alt="Windows/Linux Style" class="view-image img-wi">
        </div>

    </div>

</body>
</html>
