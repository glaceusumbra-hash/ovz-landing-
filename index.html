<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVZ Creative Solutions</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&family=IM+Fell+Double+Pica&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-serif: "IM Fell Double Pica", serif;
            --font-mono: "Chivo Mono", monospace;
            --title-shadow: 0px -3px 0px rgba(243, 238, 238, 0.6), 0px 5px 15px rgba(0,0,0,0.5);
            --text-shadow-contrast: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            font-family: var(--font-serif);
            background: linear-gradient(180deg, #80A7FB 10%, #5870A4 40%, #041843 45%, #030E26 95%);
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            position: relative;
            width: 100%; 
            padding: 20px 40px; 
            box-sizing: border-box;
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            margin-top: 15px;
        }

        .logo-container {
            position: absolute;
            left: 40px; 
            top: 20px;
            width: 110px; 
            height: 110px;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .title-group { 
            text-align: center; 
            margin-top: 5px; 
        }
        
        .title-group h1 { 
            font-size: 56px; 
            margin: 0; 
            font-weight: 400; 
            letter-spacing: 2px; 
            color: #ffffff;
            text-shadow: var(--title-shadow); 
        }
        
        .title-group h2 { 
            font-size: 30px; 
            margin: -4px 0 0 0; 
            font-weight: 400; 
            color: #f0f3f6; 
            text-shadow: var(--title-shadow); 
        }

        /* GRID DE APLICACIONES */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 80px 180px;
            margin: auto; 
            padding: 30px 20px 50px 20px;
            align-items: start; 
            justify-items: center;
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }

        .app-item {
            display: flex; 
            flex-direction: column; 
            align-items: center;
            text-decoration: none;
            width: 100%;
            max-width: 220px;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), filter 0.2s ease;
        }
        
        .app-item:hover { 
            transform: translateY(-6px); 
            filter: brightness(1.08); 
        }
        
        .app-item:active { 
            transform: scale(0.96); 
        }

        .app-icon {
            width: 130px; 
            height: 130px;
            border-radius: 28px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.25);
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin-bottom: 18px; 
            overflow: hidden;
            background: transparent;
        }
        
        .bg-black { 
            background: #0c0c0c; 
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* TIPOGRAFÍAS Y CONTRASTE */
        .label-mono { 
            font-family: var(--font-mono); 
            font-size: 20px; 
            text-align: center; 
            white-space: pre-line; 
            color: #ffffff; 
            font-weight: 700;
            line-height: 1.3;
            text-shadow: var(--text-shadow-contrast);
        }

        .label-serif { 
            font-family: var(--font-serif); 
            font-size: 17px; 
            text-align: center; 
            color: #c0d4f9; /* Contraste alto contra el fondo oscuro */
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            font-weight: bold;
            text-shadow: var(--text-shadow-contrast);
        }

        /* ====================================================
           RESPONSIVE - DISPOSITIVOS MÓVILES (< 800px)
        ==================================================== */
        @media (max-width: 800px) {
            .header {
                flex-direction: column;
                align-items: center;
                padding: 15px 20px;
                margin-top: 10px;
            }

            .logo-container {
                position: static;
                width: 80px;
                height: 80px;
                margin-bottom: 10px;
            }

            .title-group h1 {
                font-size: 42px;
            }

            .title-group h2 {
                font-size: 24px;
            }

            .app-grid {
                gap: 40px 20px;
                padding: 20px 15px 40px 15px;
                max-width: 480px;
            }

            .app-icon {
                width: 105px;
                height: 105px;
                border-radius: 22px;
                margin-bottom: 12px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            }

            .label-mono {
                font-size: 16px;
            }

            .label-serif {
                font-size: 14px;
                letter-spacing: 1px;
            }
        }

        /* FIX PANTALLAS ULTRA ESTRECHAS (< 380px) */
        @media (max-width: 380px) {
            .app-icon {
                width: 90px;
                height: 90px;
                border-radius: 18px;
            }

            .label-mono {
                font-size: 14px;
            }

            .title-group h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="assets/OVZ.png" alt="OVZ Logo">
        </div>
        <div class="title-group">
            <h1>OVZ</h1>
            <h2>Creative solutions</h2>
        </div>
    </header>

    <main class="app-grid">
        
        <!-- App 1: Figma Extractor -->
        <a href="figma_xtractorpro.html" class="app-item">
            <div class="app-icon bg-black">
                <img src="assets/Figma XT.png" alt="Figma Xtractor Pro">
            </div>
            <div class="label-serif">FIGMA X TRACTOR PRO</div>
        </a>

        <!-- App 2: Portfolio -->
        <a href="portfolio.html" class="app-item">
            <div class="app-icon">
                <img src="assets/Folder.png" alt="Portfolio">
            </div>
            <div class="label-mono">portfolio</div>
        </a>

        <!-- App 3: Landing Page -->
        <a href="get_your_landing.html" class="app-item">
            <div class="app-icon">
                <img src="assets/Chrome.png" alt="Get your landing page">
            </div>
            <div class="label-mono">get your<br>landing page</div>
        </a>

        <!-- App 4: Special Idea -->
        <a href="modo_dev.html" class="app-item">
            <div class="app-icon">
                <img src="assets/Idea.png" alt="Any special idea?">
            </div>
            <div class="label-mono">any special<br>idea?</div>
        </a>

    </main>

</body>
</html>
